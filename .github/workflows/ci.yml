name: ci

on:
  push:
    branches: [main, "cursor/**"]
  pull_request:
    branches: [main]

jobs:
  linux-core-and-mac-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure & build lenstrans_test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=g++
          cmake --build build --target lenstrans_test -j

      - name: Run lenstrans_test
        env:
          LENSTRANS_ROOT: ${{ github.workspace }}
        run: ./build/lenstrans_test

      - name: mac-logic-verify.py
        run: python3 tools/eval/mac-logic-verify.py

      - name: Install Swift
        run: |
          curl -fsSL -o /tmp/swift.tar.gz \
            https://download.swift.org/swift-5.10.1-release/ubuntu2204/swift-5.10.1-RELEASE/swift-5.10.1-RELEASE-ubuntu22.04.tar.gz
          sudo mkdir -p /opt/swift
          sudo tar -xzf /tmp/swift.tar.gz -C /opt/swift --strip-components=1
          echo /opt/swift/usr/bin >> $GITHUB_PATH
          sudo apt-get update -qq
          sudo apt-get install -y -qq libncurses6

      - name: swift test (LensTransLogic)
        working-directory: mac
        run: /opt/swift/usr/bin/swift test

      - name: goal-verify.py
        run: |
          export PATH="/usr/bin:/bin:/opt/swift/usr/bin:$PATH"
          python3 tools/eval/goal-verify.py

  windows-native-gate:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Enable MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      - name: Cache llama.cpp build
        uses: actions/cache@v4
        with:
          path: third_party/llama.cpp
          key: llama-b10688-win2022-ninja-v3

      - name: Cache GGUF
        uses: actions/cache@v4
        with:
          path: models/qwen2.5-0.5b-instruct-q4_k_m.gguf
          key: gguf-qwen25-15b-q4km-6a1a2eb6

      - name: Windows CI (build, test, pack, gguf, WS)
        shell: pwsh
        run: powershell -File tools/eval/windows-ci.ps1 -WithGguf

      - name: Upload eval artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-eval-out
          path: tools/eval/out/
          if-no-files-found: warn
